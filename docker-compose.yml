services:
  postgres:
    image: postgres:15-alpine
    container_name: day-trading-db
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_password}
      POSTGRES_DB: day_trading_bot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d day_trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: day-trading-api
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://trading_user:${POSTGRES_PASSWORD:-trading_password}@postgres:5432/day_trading_bot
      MODEL_PATH: /app/model_files/
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_files:/app/model_files
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
    container_name: day-trading-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  model_files:

networks:
  default:
    name: trading-network
