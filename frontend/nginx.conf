server {
    listen 3000;

    # The dashboard and the API share one address, so a single link works from anywhere.
    # Docker's DNS is re-queried so the proxy survives backend restarts.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        # Keep the address the visitor used: the API treats non-localhost visitors as view-only
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
